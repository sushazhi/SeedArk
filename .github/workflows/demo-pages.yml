# 在线预览：以演示模式构建前端（浏览器内 mock 后端，无需真实
# Transmission），发布到 GitHub Pages。首次启用需在仓库 Settings → Pages
# 把 Source 设为 GitHub Actions。
#
# 触发器：推送 v* 标签时自动更新；也支持手动触发。
# 注意：github-pages 环境默认只放行默认分支部署，因此需一次性在
# Settings → Environments → github-pages → Deployment branches and tags
# 选「Selected branches and tags」并添加 master 与 v*，否则打标签部署会被环境规则拒绝。
name: Demo Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建演示版
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建演示版
        working-directory: frontend
        run: pnpm build:demo

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
