# seedark 容器部署示例
#
# 1) 复制为 .env 同目录后按需修改，再执行：docker compose up -d
# 2) API_TOKEN 必填：SERVER_HOST=0.0.0.0 时若不启用令牌鉴权，服务会拒绝启动
# 3) 数据与状态文件（sa-state.json、界面保存的连接配置）持久化在 seedark-data 卷的 /data

services:
  seedark:
    # 两个仓库内容一致（同一次 CI 构建推送）：Docker Hub 国内拉取更快
    image: jianhuayanyu/seedark:latest
    # image: ghcr.io/sushazhi/seedark:latest
    container_name: seedark
    restart: unless-stopped
    ports:
      # 仅本机或经反代访问时，改成 "127.0.0.1:8200:8200"
      - "8200:8200"
    environment:
      # 下载器类型：transmission / qbittorrent（qBittorrent 时 SA_URL 填 WebUI 根地址）
      SA_TYPE: transmission
      # 下载器 RPC 地址（同机用 host.docker.internal，同 compose 网络用服务名）
      SA_URL: http://host.docker.internal:9091/transmission/rpc
      SA_USER: ""
      SA_PASS: ""
      # 浏览器首次访问需要粘贴此令牌（缺失时容器拒绝启动）
      API_TOKEN: ${API_TOKEN:?请设置 API_TOKEN，例如 API_TOKEN=xxx docker compose up -d}
      # 可选：日志时区
      TZ: Asia/Shanghai
      # 可选：轮询间隔
      POLL_INTERVAL: 2s
    volumes:
      - seedark-data:/data
    # Linux 上让容器能访问宿主机的 Transmission；Docker Desktop（Win/Mac）可忽略
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  seedark-data:
