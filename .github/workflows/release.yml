# 仅推送标签（v*）时构建发布：交叉编译 linux/amd64 + linux/arm64，
# 打包为带版本号的 tar.gz，附 sha256 校验和，上传到 GitHub Release。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 构建前端并嵌入后端
        run: |
          set -e
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          # go:embed 读取 backend/web/dist，把前端产物复制过去再编译
          rm -rf backend/web/dist
          mkdir -p backend/web/dist
          cp -r frontend/dist/. backend/web/dist/

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 交叉编译并打包
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p release
          for ARCH in amd64 arm64; do
            # 二进制统一命名，版本信息放进归档文件名
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" \
              go build -trimpath -ldflags "-s -w" -o ../release/seedark ./cmd/server)
            tar -czf "release/seedark-${TAG}-linux-${ARCH}.tar.gz" \
              -C release seedark
            rm -f release/seedark
          done
          cd release
          sha256sum seedark-*.tar.gz > "checksums-${TAG}-sha256.txt"

      # Release 正文取 CHANGELOG.md 中「本版本」那一节（面向用户、已分好类），
      # 而不是 GitHub 自动生成的 commit 列表 + Full Changelog
      - name: 提取本版本更新日志
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          python3 - <<'PY'
          import os, re

          ver = os.environ["TAG"].lstrip("v")
          out, found = [], False
          for line in open("CHANGELOG.md", encoding="utf-8").read().splitlines():
              m = re.match(r"^## \[([^\]]+)\]", line)
              if m:                      # 版本标题行：定位本节 / 结束
                  if found:
                      break
                  if m.group(1).lstrip("v") == ver:
                      found = True
                  continue
              if found:
                  out.append(line)
          while out and not out[0].strip():
              out.pop(0)
          while out and not out[-1].strip():
              out.pop()
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n" if out else "")
          PY
          # 末尾补上与上一版本的提交对比链接（CHANGELOG 未记录的小改动也能查到）
          git fetch --tags --force -q || true
          prev=$(git tag -l 'v*' | grep -v -x "${TAG}" | sort -V | tail -n 1 || true)
          if [ -s release-notes.md ]; then
            if [ -n "${prev}" ]; then
              printf '\n---\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "${GITHUB_REPOSITORY}" "${prev}" "${TAG}" >> release-notes.md
            fi
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            # CHANGELOG 还没补这一节时，退回 GitHub 自动生成的 notes
            echo "::warning::CHANGELOG.md 中没有 ${TAG} 的章节，回退为自动生成的更新日志"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          files: |
            release/seedark-*.tar.gz
            release/checksums-*-sha256.txt
