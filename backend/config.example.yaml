# Transmission 连接配置
sa_url: "http://localhost:9091/transmission/rpc"
sa_user: "admin"
sa_pass: "password"

# 服务配置
server_port: 8200
poll_interval: "2s"
log_level: "info"

# 宿主平台：generic（默认，Docker / 物理机 / 任意 Linux 直连）| fnos（飞牛应用）
# 留空时自动推断：配置了 gateway_prefix 或检测到宿主注入的 TRIM_APPDEST 即判定为 fnos
platform: "generic"

# 宿主网关挂载的 URL 前缀（如飞牛统一网关的 /app/transmission）；直连部署留空
gateway_prefix: ""

# 「按路径添加种子」允许读取的根目录（逗号分隔）
# 宿主文件选择器返回的路径必须落在这些目录下；清空则关闭按路径添加
torrent_path_roots: "/vol,/mnt,/media,/volume1"

# MCP 服务：把种子管理能力以 MCP 工具暴露给 AI 客户端（Claude / Qoder / Cursor 等）
# 端点：http://<host>:<port>/mcp；也可在 Web 设置界面配置（即时生效，保存后写入 .env.local 且优先于本文件）
mcp_enabled: false
# 危险操作开关：允许 AI 通过 MCP 删除种子（deleteData=true 时连同本地文件），默认关闭
mcp_allow_delete: false
# 其它高危操作开关：允许 AI 通过 MCP 移动 / 重命名种子文件、立即执行做种策略（含删数据），默认关闭
mcp_allow_dangerous: false
# MCP 接入令牌（独立于 api_token，仅作用于 /mcp）：客户端以 Authorization: Bearer <令牌> 鉴权；留空 = 不启用
mcp_token: ""
# MCP 专用直连端口（1-65535，留空 = 不开启；修改需重启生效）。
# 该端口不经过宿主网关统一认证，因此必须同时配置 mcp_token 才会启动
mcp_port: ""
